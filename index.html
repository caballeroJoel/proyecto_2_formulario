<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta Inteligente de Aula</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- SECCIÓN FORMULARIO -->
        <section class="formulario-seccion">
            <div class="formulario-card">
                <h1>Encuesta de Aula</h1>
                <p class="subtitulo">Tu opinión nos importa</p>
                
                <form id="formulario-encuesta">
                    <!-- Selector de Grupo (US-03) -->
                    <div class="form-group">
                        <label for="grupo">Grupo</label>
                        <select id="grupo" name="grupo" required>
                            <option value="">-- Selecciona tu grupo --</option>
                            <option value="DAW1A">DAW1A</option>
                            <option value="DAW1B">DAW1B</option>
                            <option value="ASIX1">ASIX1</option>
                        </select>
                    </div>

                    <!-- Puntuación 1-5 (US-01) -->
                    <div class="form-group">
                        <label>Puntuación</label>
                        <div class="rating-container">
                            <input type="radio" id="rating-1" name="puntuacion" value="1">
                            <label for="rating-1" class="rating-label">1</label>
                            
                            <input type="radio" id="rating-2" name="puntuacion" value="2">
                            <label for="rating-2" class="rating-label">2</label>
                            
                            <input type="radio" id="rating-3" name="puntuacion" value="3">
                            <label for="rating-3" class="rating-label">3</label>
                            
                            <input type="radio" id="rating-4" name="puntuacion" value="4">
                            <label for="rating-4" class="rating-label">4</label>
                            
                            <input type="radio" id="rating-5" name="puntuacion" value="5">
                            <label for="rating-5" class="rating-label">5</label>
                        </div>
                    </div>

                    <!-- Comentario Opcional (US-02) -->
                    <div class="form-group">
                        <label for="comentario">Comentario (opcional)</label>
                        <textarea id="comentario" name="comentario" placeholder="Comparte tu opinión..." rows="4"></textarea>
                    </div>

                    <!-- Botón Enviar -->
                    <button type="submit" class="btn-enviar">Enviar Encuesta</button>
                </form>

                <!-- Confirmación Visual -->
                <div id="confirmacion" class="confirmacion-oculta">
                    <div class="confirmacion-contenido">
                        <p>✓ Encuesta enviada correctamente</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN PANEL DE ANALÍTICA -->
        <section class="panel-seccion">
            <div class="panel-header">
                <h2>Panel de Analítica</h2>
                
                <!-- Filtro por Grupo -->
                <div class="filtro-grupo">
                    <label for="filtro">Filtrar por grupo:</label>
                    <select id="filtro">
                        <option value="todos">Todos</option>
                        <option value="DAW1A">DAW1A</option>
                        <option value="DAW1B">DAW1B</option>
                        <option value="ASIX1">ASIX1</option>
                    </select>
                </div>
            </div>

            <!-- KPIS -->
            <div class="kpis">
                <div class="kpi-card">
                    <p class="kpi-label">Total Respuestas</p>
                    <p class="kpi-valor" id="kpi-total">0</p>
                </div>
                <div class="kpi-card">
                    <p class="kpi-label">Puntuación Media</p>
                    <p class="kpi-valor" id="kpi-media">0.0</p>
                </div>
                <div class="kpi-card">
                    <p class="kpi-label">% Positivas (4-5)</p>
                    <p class="kpi-valor" id="kpi-positivas">0%</p>
                </div>
            </div>

            <!-- GRÁFICAS -->
            <div class="graficas-container">
                <!-- Gráfica de Distribución de Puntuaciones -->
                <div class="grafica-card">
                    <h3>Distribución de Puntuaciones</h3>
                    <div style="display: flex; justify-content: center; align-items: center; height: 320px;">
                        <canvas id="grafica-distribucion"></canvas>
                    </div>
                </div>

                <!-- Gráfica Comparativa por Grupo (Quesito) -->
                <div class="grafica-card">
                    <h3>Puntuación Media por Grupo</h3>
                    <div style="display: flex; justify-content: center; align-items: center; height: 300px;">
                        <canvas id="grafica-comparativa"></canvas>
                    </div>
                </div>
            </div>

            <!-- LISTADO DE RESPUESTAS -->
            <div class="respuestas-card">
                <h3>Respuestas Filtradas</h3>
                <div id="listado-respuestas" class="listado-respuestas">
                    <p class="sin-respuestas">Sin respuestas aún</p>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
